name: Build isolated Arctic Fuse Premium Lab

on:
  push:
    branches: [kodi-repo]
    paths:
      - '.github/workflows/publish-premium-lab.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lab-zip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout distribution branch and source history
        uses: actions/checkout@v4
        with:
          ref: kodi-repo
          fetch-depth: 0
      - name: Build isolated side-by-side Kodi skin
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin dev-kodi22 lab-premium-spotlight
          python3 - <<'PY'
          import io
          import hashlib
          import subprocess
          import tarfile
          import xml.etree.ElementTree as ET
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED

          SRC = 'skin.arctic.fuse.3'
          LAB = 'skin.arctic.fuse.3.premium.lab'
          VERSION = '3.4.2.29'
          SERVICE = 'service.skin.arctic.fuse.3.dev.trailers'
          out = Path('/tmp') / f'{LAB}-{VERSION}.zip'

          changed = subprocess.check_output([
              'git', 'diff', '--name-only',
              'origin/dev-kodi22...origin/lab-premium-spotlight'
          ], text=True).splitlines()
          assert changed == [
              '1080i/Includes_Hubs.xml',
              'media/common/spotlight-fill.png',
              'media/common/spotlight-outline.png'
          ], ('LAB must alter only 1 Spotlight XML and 2 decorative PNG textures', changed)

          # Source Emby service 0.4.8 must remain byte-identical to DEV baseline.
          for name in ('addon.xml', 'service.py'):
              p = f'kodi-dev-addons/{SERVICE}/{name}'
              lab_bytes = subprocess.check_output([
                  'git', 'show', f'origin/lab-premium-spotlight:{p}'])
              stable_bytes = subprocess.check_output([
                  'git', 'show', f'origin/dev-kodi22:{p}'])
              assert lab_bytes == stable_bytes, f'Frozen Emby source changed: {p}'

          source_tar = subprocess.check_output([
              'git', 'archive', '--format=tar', 'origin/lab-premium-spotlight'])
          files = {}
          with tarfile.open(fileobj=io.BytesIO(source_tar), mode='r:') as archive:
              for entry in archive:
                  if not entry.isfile():
                      continue
                  name = entry.name
                  if (name.startswith(('.github/', 'kodi-dev-addons/')) or
                      name in ('.gitignore', '.gitattributes')):
                      continue
                  payload = archive.extractfile(entry).read()
                  if name.endswith(('.xml', '.json', '.xmltemplate', '.xsp',
                                    '.py', '.md', '.txt', '.yml', '.yaml')):
                      txt = payload.decode('utf-8')
                      txt = txt.replace(SRC, LAB)
                      if name == 'addon.xml':
                          txt = txt.replace('name="Arctic Fuse 3"',
                              'name="Arctic Fuse 3 Premium LAB"', 1)
                          txt = txt.replace('version="3.4.2"',
                              'version="' + VERSION + '"', 1)
                          txt = txt.replace('provider-name="jurialmunkey"',
                              'provider-name="jurialmunkey / ntls2000"', 1)
                          txt = txt.replace('</requires>',
                              '    <import addon="' + SERVICE +
                              '" version="0.4.8" />\n    </requires>', 1)
                          txt = txt.replace(
                              'addon="resource.images.arctic.splash" version="1.0.6"',
                              'addon="resource.images.arctic.splash" version="1.0.0"',
                              1)
                      payload = txt.encode('utf-8')
                  files[name] = payload

          manifest = ET.fromstring(files['addon.xml'])
          assert manifest.get('id') == LAB
          assert manifest.get('version') == VERSION
          assert manifest.get('name') == 'Arctic Fuse 3 Premium LAB'
          assert any(x.get('addon') == SERVICE and x.get('version') == '0.4.8'
                     for x in manifest.findall('./requires/import'))
          hub = files['1080i/Includes_Hubs.xml'].decode('utf-8')
          ET.fromstring(hub)
          assert hub.count('<include content="Hub_Spotlight_Button_Circle">') == 2
          assert hub.count('<control type="button" id="$PARAM[id]">') == 1
          assert hub.count('<control type="group" id="$PARAM[groupid]">') == 1
          assert '<control type="group" id="316">' in hub
          assert '<width>435</width>' in hub
          assert '<param name="card_width">410</param>' in hub
          assert hub.count('<param name="card_bg">330A0A0A</param>') == 3, "Both unfocused centres must be translucent"
          assert hub.count('<param name="card_icon">FFFFFFFF</param>') == 3
          assert hub.count('<param name="card_text">FFFFFFFF</param>') == 3
          assert '<visible>!Control.HasFocus($PARAM[id])</visible>' in hub
          assert '<visible>Control.HasFocus($PARAM[id])</visible>' in hub
          assert '<param name="label">Lecture</param>' in hub
          assert '<param name="label">Informations</param>' in hub
          assert hub.count('<texture border="22" colordiffuse="$PARAM[card_bg]">common/spotlight-fill.png</texture>') == 1
          assert hub.count('<texture border="22" colordiffuse="DDFFFFFF">common/spotlight-outline.png</texture>') == 1
          assert hub.count('<texture border="22" colordiffuse="FFFFFFFF">common/spotlight-fill.png</texture>') == 1
          assert '<texture background="true" colordiffuse="FF181818">$PARAM[image]</texture>' in hub
          assert '<focusedcolor>FF181818</focusedcolor>' in hub
          spotlight = hub.split('<include name="Hub_Spotlight_Button_Circle">', 1)[1].split('</definition>', 1)[0]
          assert spotlight.count('<height>84</height>') == 4, "2 background textures + focus card + native button height"
          assert '<height>72</height>' not in spotlight
          assert '<width>$PARAM[card_width]</width>' in spotlight
          # Anti-aliased 96x84 PNGs. Git blob exact hashes guarantee neither
          # image is subtly corrupted on GitHub before package production.
          expected_pngs = {
              'media/common/spotlight-outline.png': 'cc16465f70a043b9326fdd26a5740965399ca80833537574820913d9c3c3f134',
              'media/common/spotlight-fill.png': '7e521cd8bd9c0dcd9a3f2a7481cb858f8d1f29ff55d00f693e8c6250a0d1da7d',
          }
          for png, digest in expected_pngs.items():
              b = files[png]
              assert b.startswith(b'\\x89PNG\\r\\n\\x1a\\n')
              import struct
              assert struct.unpack('>II', b[16:24]) == (96, 84)
              assert hashlib.sha256(b).hexdigest() == digest, f'LAB PNG texture bytes wrong: {png}'
          assert '<onright>312</onright>' in hub
          assert '<onclick>SetFocus(311)</onclick>' in hub
          assert '<onclick>SetFocus(312)</onclick>' in hub
          assert '<ondown>$VAR[Hub_Action_Widgets]</ondown>' in hub
          assert '<nested />' in hub
          assert 'Skin.HasSetting(Spotlight.PremiumButtons)' not in hub
          for name in ('1080i/Includes_Home.xml',
                       '1080i/Includes_SkinSettings.xml',
                       '1080i/Includes_Textures.xml'):
              ET.fromstring(files[name])

          assert len(files) > 3500 and 'media/Textures.xbt' in files
          with ZipFile(out, 'w', compression=ZIP_DEFLATED,
                       compresslevel=6, allowZip64=True) as target:
              for name, data in sorted(files.items()):
                  target.writestr(f'{LAB}/{name}', data)
          with ZipFile(out) as test:
              assert test.testzip() is None
              assert test.read(f'{LAB}/addon.xml') == files['addon.xml']
          print('ISOLATED PREMIUM LAB: original IDs 311/312 and group 316 preserved')
          print('ONLY LAB changes: Includes_Hubs.xml and two rounded 84px PNG textures')
          print('Frozen Emby source 0.4.8 unchanged')
          print('LAB ZIP:', out)
          print('FILES:', len(files))
          PY
          unzip -tq /tmp/skin.arctic.fuse.3.premium.lab-3.4.2.29.zip
          sha256sum /tmp/skin.arctic.fuse.3.premium.lab-3.4.2.29.zip
      - name: Release pre-verified standalone lab ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag='arctic-fuse-3-premium-lab-3.4.2.29'
          zip='/tmp/skin.arctic.fuse.3.premium.lab-3.4.2.29.zip'
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --prerelease --target lab-premium-spotlight \
              --title 'Arctic Fuse 3 Premium LAB 3.4.2.29 (isolated experiment)' \
              --notes 'UNVALIDATED Kodi 22 LAB: Premium Spotlight actions are now labelled Lecture and Informations in French, 410x84 pixels high with antialiased rounded corners and fine rounded border. Only focused action fills white with black icon/text. All navigation IDs 311/312, group 316, action callbacks and Emby service 0.4.8 unchanged. Parallel-installed stable DEV remains version 3.4.2.24.'
          fi
          gh release upload "$tag" "$zip" --clobber
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 240 \
            --output /tmp/lab-public-check.zip \
            "https://github.com/ntls2000/skin.arctic.fuse.3/releases/download/$tag/skin.arctic.fuse.3.premium.lab-3.4.2.29.zip"
          cmp "$zip" /tmp/lab-public-check.zip
          unzip -tq /tmp/lab-public-check.zip
          echo 'PREMIUM LAB release verified byte-for-byte after public download' 
      - name: Publish LAB archive into NTLS2000 Kodi repository
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import hashlib
          import shutil
          import xml.etree.ElementTree as ET

          root_dir = Path('kodi-repository')
          lab_id = 'skin.arctic.fuse.3.premium.lab'
          lab_version = '3.4.2.29'
          lab_file = f'{lab_id}-{lab_version}.zip'
          src_zip = Path('/tmp') / lab_file
          lab_dir = root_dir / lab_id
          catalog_path = root_dir / 'addons.xml'
          stable_id = 'skin.arctic.fuse.3.dev'
          svc_id = 'service.skin.arctic.fuse.3.dev.trailers'
          repo_id = 'repository.ntls2000.kodi.dev'

          # The exact stable version/bytes are guardrails, never update them.
          stable_zip = root_dir / stable_id / f'{stable_id}-3.4.2.24.zip'
          assert stable_zip.exists(), 'Validated DEV 3.4.2.24 archive missing'
          stable_before = hashlib.sha256(stable_zip.read_bytes()).hexdigest()
          print('Stable DEV package SHA256 at checkout (must not change):', stable_before)
          stable_manifest = ET.parse(root_dir / stable_id / 'addon.xml').getroot()
          assert stable_manifest.get('id') == stable_id
          assert stable_manifest.get('version') == '3.4.2.24'
          service_xml = ET.parse(root_dir / svc_id / 'addon.xml').getroot()
          assert service_xml.get('version') == '0.4.8'

          with ZipFile(src_zip) as archive:
              assert archive.testzip() is None
              manifest_bytes = archive.read(f'{lab_id}/addon.xml')
              icon_bytes = archive.read(f'{lab_id}/icon.png')
              fanart_bytes = archive.read(f'{lab_id}/fanart.jpg')
          lab_manifest = ET.fromstring(manifest_bytes)
          assert lab_manifest.get('id') == lab_id
          assert lab_manifest.get('version') == lab_version
          assert lab_manifest.get('name') == 'Arctic Fuse 3 Premium LAB'
          assert any(x.get('addon') == svc_id and x.get('version') == '0.4.8'
                     for x in lab_manifest.findall('./requires/import'))
          assert hashlib.sha256(src_zip.read_bytes()).digest() == (
              hashlib.sha256(Path('/tmp/lab-public-check.zip').read_bytes()).digest()), 'LAB ZIP differs from GitHub verified release'

          lab_dir.mkdir(parents=True, exist_ok=True)
          # Keep only the latest LAB installable version in this repository.
          for previous in lab_dir.glob(f'{lab_id}-*.zip'):
              if previous.name != lab_file:
                  previous.unlink()
          shutil.copyfile(src_zip, lab_dir / lab_file)
          (lab_dir / 'addon.xml').write_bytes(manifest_bytes)
          (lab_dir / 'icon.png').write_bytes(icon_bytes)
          (lab_dir / 'fanart.jpg').write_bytes(fanart_bytes)

          catalog_root = ET.parse(catalog_path).getroot()
          assert catalog_root.tag == 'addons'
          existing_ids = [child.get('id') for child in catalog_root]
          assert len(existing_ids) == 4 and set(existing_ids) == {
              repo_id, stable_id, svc_id, lab_id}, (
              'Expected stable DEV, trailer service and previous LAB', existing_ids)
          previous_lab = catalog_root.find(f"./addon[@id='{lab_id}']")
          assert previous_lab is not None
          assert previous_lab.get('version') in ('3.4.2.28', lab_version)
          catalog_root.remove(previous_lab)
          catalog_root.append(lab_manifest)
          ids = [child.get('id') for child in catalog_root]
          assert len(ids) == len(set(ids)) == 4, 'Repository must list 4 unique add-ons'
          assert catalog_root.find(f"./addon[@id='{stable_id}']").get('version') == '3.4.2.24'
          assert catalog_root.find(f"./addon[@id='{svc_id}']").get('version') == '0.4.8'
          ET.indent(catalog_root, space='    ')
          catalog = ET.tostring(catalog_root, encoding='utf-8',
                                xml_declaration=True) + b'\n'
          catalog_path.write_bytes(catalog)
          (root_dir / 'addons.xml.md5').write_text(
              hashlib.md5(catalog).hexdigest() + '\n', encoding='ascii')
          assert hashlib.sha256(stable_zip.read_bytes()).hexdigest() == stable_before
          assert len(ET.parse(catalog_path).getroot()) == 4
          print('PREMIUM LAB REPO CATALOG READY: 4 distinct add-on IDs; DEV 3.4.2.24 untouched')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -f kodi-repository/skin.arctic.fuse.3.premium.lab/ kodi-repository/addons.xml kodi-repository/addons.xml.md5
          git diff --cached --quiet && { echo "Lab catalog was not changed"; exit 1; }
          git commit -m 'repo(kodi): publish Premium LAB 3.4.2.29 rounded 84px French Spotlight labels'
          git push origin HEAD:kodi-repo
          git cat-file blob HEAD:kodi-repository/skin.arctic.fuse.3.premium.lab/skin.arctic.fuse.3.premium.lab-3.4.2.29.zip > /tmp/git-stored-lab.zip
          cmp /tmp/git-stored-lab.zip /tmp/skin.arctic.fuse.3.premium.lab-3.4.2.29.zip
          unzip -tq /tmp/git-stored-lab.zip
          curl --fail --location --retry 3 --retry-all-errors --connect-timeout 20 --max-time 240 \
            --output /tmp/lab-repository-download.zip \
            https://raw.githubusercontent.com/ntls2000/skin.arctic.fuse.3/kodi-repo/kodi-repository/skin.arctic.fuse.3.premium.lab/skin.arctic.fuse.3.premium.lab-3.4.2.29.zip
          cmp /tmp/git-stored-lab.zip /tmp/lab-repository-download.zip
          unzip -tq /tmp/lab-repository-download.zip
          git show HEAD:kodi-repository/addons.xml | grep 'skin.arctic.fuse.3.premium.lab'
          git show HEAD:kodi-repository/addons.xml | grep 'skin.arctic.fuse.3.dev'
          echo 'KODI REPO PREMIUM LAB: public archive matches release and is cataloged alongside stable DEV'

