name: Verify published Kodi skin ZIP and offer release mirror

on:
  push:
    branches: [kodi-repo]
    paths:
      - '.github/workflows/verify-kodi-zip.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: kodi-repo
      - name: Verify local vs public download and ZIP structure
        shell: bash
        run: |
          set -euo pipefail
          name='skin.arctic.fuse.3.dev-3.4.2.41.zip'
          local_file="kodi-repository/skin.arctic.fuse.3.dev/$name"
          source_url="https://raw.githubusercontent.com/ntls2000/skin.arctic.fuse.3/kodi-repo/kodi-repository/skin.arctic.fuse.3.dev/$name"
          echo "Local file:"
          ls -l "$local_file"
          sha256sum "$local_file"
          unzip -tq "$local_file"
          echo "Download from public URL:"
          curl --fail --location --retry 3 --retry-all-errors --connect-timeout 20 --max-time 240 --output /tmp/remote-skin.zip --write-out 'http_code=%{http_code} content_type=%{content_type} bytes=%{size_download}\n' "$source_url"
          ls -l /tmp/remote-skin.zip
          file /tmp/remote-skin.zip
          sha256sum /tmp/remote-skin.zip
          if cmp "$local_file" /tmp/remote-skin.zip; then
            echo 'Public raw ZIP byte-for-byte matches the Git checkout'
          else
            echo "::warning::Public raw download and checked out Git ZIP differ"
          fi
          unzip -tq /tmp/remote-skin.zip || echo "::warning::Public raw download has invalid ZIP structure"
      - name: Publish tested skin ZIP through GitHub Releases as fallback
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag='arctic-fuse-3-dev-3.4.2.41'
          asset='kodi-repository/skin.arctic.fuse.3.dev/skin.arctic.fuse.3.dev-3.4.2.41.zip'
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --prerelease --target kodi-repo \
              --title 'Arctic Fuse 3 DEV 3.4.2.41 (Kodi installer)' \
              --notes 'Arctic Fuse 3 DEV 3.4.2.41 adds 14 Kodi smart playlists (eight movies, six series) for Netflix / Prime Video / Apple TV genre-based hubs: action, romance, comedy, thrillers, sci-fi, horror, animation, documentaries, crime and drama. Additive files only under extras/hub/streaming, referenced by an independent custom hubs ZIP. Genres filter the synchronized local Kodi video database (including synced Emby items), not unverified remote Emby categories; empty shelves are possible if no matching genre or unsynced media. Spotlight layout and focus, Premium/Normal style selector, hub backup/restore, Emby trailer engine, and the separate Emby service 0.4.8 are unchanged. CI verifies playlists, Emby regressions, ZIP integrity and public download. Kodi 22 visual test pending.'
          fi
          gh release upload "$tag" "$asset" --clobber
          url="https://github.com/ntls2000/skin.arctic.fuse.3/releases/download/$tag/skin.arctic.fuse.3.dev-3.4.2.41.zip"
          curl --fail --location --retry 3 --retry-all-errors --connect-timeout 20 --max-time 240 --output /tmp/release-skin.zip --write-out 'release_http=%{http_code} release_bytes=%{size_download}\n' "$url"
          cmp "$asset" /tmp/release-skin.zip
          unzip -tq /tmp/release-skin.zip
          echo 'Release asset verified byte-for-byte after remote download'
