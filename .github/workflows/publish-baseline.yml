name: Publish Arctic Fuse 3 DEV baseline
on:
  push:
    branches: [kodi-repo]
    paths:
      - '.github/workflows/publish-baseline.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-baseline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout distribution branch and source history
        uses: actions/checkout@v4
        with:
          ref: kodi-repo
          fetch-depth: 0
      - name: Build original-source parallel-install skin and Kodi catalog
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import io
          import subprocess
          import tarfile
          import xml.etree.ElementTree as ET
          from zipfile import ZipFile, ZIP_DEFLATED

          SOURCE_REF = "origin/dev-kodi22"
          SRC_ID = "skin.arctic.fuse.3"
          DEV_ID = "skin.arctic.fuse.3.dev"
          DEV_VER = "3.4.2.20"
          out = Path("kodi-repository")
          target = out / DEV_ID
          target.mkdir(parents=True, exist_ok=True)
          package = target / (DEV_ID + "-" + DEV_VER + ".zip")
          source_tar = subprocess.check_output(["git", "archive", "--format=tar", SOURCE_REF])
          source = tarfile.open(fileobj=io.BytesIO(source_tar), mode="r:")
          entries = {}
          for entry in source:
              if not entry.isfile():
                  continue
              name = entry.name
              if name.startswith((".github/", "kodi-dev-addons/")) or name in (".gitignore", ".gitattributes"):
                  continue
              payload = source.extractfile(entry).read()
              if name.endswith((".xml", ".json", ".xmltemplate", ".xsp", ".py", ".md", ".txt", ".yml", ".yaml")):
                  txt = payload.decode("utf-8")
                  txt = txt.replace(SRC_ID, DEV_ID)
                  if name == "addon.xml":
                      txt = txt.replace('name="Arctic Fuse 3"', 'name="Arctic Fuse 3 DEV (Original)"', 1)
                      txt = txt.replace('version="3.4.2"', 'version="' + DEV_VER + '"', 1)
                      txt = txt.replace('provider-name="jurialmunkey"', 'provider-name="jurialmunkey / ntls2000"', 1)
                      service_import = '<import addon="service.skin.arctic.fuse.3.dev.trailers" version="0.4.8" />'
                      txt = txt.replace('</requires>', '    ' + service_import + '\n    </requires>', 1)
                      txt = txt.replace('addon="resource.images.arctic.splash" version="1.0.6"', 'addon="resource.images.arctic.splash" version="1.0.0"', 1)
                  payload = txt.encode("utf-8")
              entries[name] = payload

          manifest = ET.fromstring(entries["addon.xml"])
          assert manifest.get("id") == DEV_ID
          assert manifest.get("version") == DEV_VER
          assert any(x.get("addon") == "resource.images.arctic.splash" and x.get("version") == "1.0.0" for x in manifest.findall("./requires/import")), "Arctic Splash version check failed"
          assert "LICENSE.txt" in entries
          assert "media/Textures.xbt" in entries
          assert "1080i/Home.xml" in entries
          # This release renames only the visible setting; its Kodi key and
          # previously saved user choice must remain untouched.
          setting_source = entries["1080i/Includes_SkinSettings.xml"].decode("utf-8")
          assert "<label>Activer les trailers dans le Spotlight</label>" in setting_source
          assert "<selected>Skin.HasSetting(Spotlight.AutoTrailer)</selected>" in setting_source
          assert "<onclick>Skin.ToggleSetting(Spotlight.AutoTrailer)</onclick>" in setting_source
          # Navigation recovery: focusable 311/312 must ALWAYS exist.
          # The previous Premium build compiled these with conditional include
          # substitutions and the user's Kodi was stranded without navigation.
          import re
          hub_xml = entries["1080i/Includes_Hubs.xml"].decode("utf-8")
          texture_xml = entries["1080i/Includes_Textures.xml"].decode("utf-8")
          home_xml = entries["1080i/Includes_Home.xml"].decode("utf-8")
          for source in (hub_xml, texture_xml, home_xml, setting_source):
              ET.fromstring(source)
          assert 'Hub_Spotlight_Button_Premium' not in hub_xml, "Premium-only focusable controls are forbidden"
          assert hub_xml.count('<include content="Hub_Spotlight_Button_Circle">') == 2, "Permanent Play+Info include pair required"
          assert '<include content="Hub_Spotlight_Button_Circle" condition=' not in hub_xml
          stable = hub_xml.split('<include name="Hub_Spotlight_Button_Circle">',1)[1].split('</definition>',1)[0]
          assert stable.count('<control type="button" id="$PARAM[id]">') == 1, "Exactly one focusable button per include"
          assert '<control type="group" id="$PARAM[groupid]">' in stable
          assert '<visible>!Skin.HasSetting(Spotlight.PremiumButtons)</visible>' not in stable.split('<control type="group" id="$PARAM[groupid]">',1)[1].split('<control type="group">',1)[0], "Do not hide the button's parent"
          assert '<nested />' in stable
          assert '<left>$PARAM[textleft]</left>' in stable
          assert '<visible>Skin.HasSetting(Spotlight.PremiumButtons)</visible>' in stable
          assert '<width>$PARAM[premium_width]</width>' in stable
          assert '<height>72</height>' in stable
          assert '<width>32</width>' in stable
          assert 'Texture_Highlight_Spotlight_Premium_Transparent' in stable
          assert 'Texture_Highlight_Spotlight_Premium_Transparent' in texture_xml
          assert 'id="316"' in hub_xml and '<width>$VAR[AF3DEV_SpotlightPlayGroupWidth]</width>' in hub_xml
          for field in ('PlayGroupWidth','PlayTextLeft','PlayTextColor','InfoIconLeft',
                        'InfoTextLeft','InfoButtonWidth'):
              assert 'name="AF3DEV_Spotlight' + field + '"' in home_xml
          for button_id in (311,312):
              assert '<param name="id">' + str(button_id) + '</param>' in hub_xml
              assert '<onclick>SetFocus(' + str(button_id) + ')</onclick>' in hub_xml
          assert '<onright>312</onright>' in hub_xml
          assert '<onclick>Skin.ToggleSetting(Spotlight.PremiumButtons)</onclick>' in setting_source
          assert '<onclick>ReloadSkin()</onclick>' in setting_source
          print("Spotlight Premium navigation recovery PASSED: permanent 311/312 in both modes, original actions and focus path")
          assert "shortcuts/skinvariables-generator.json" in entries
          assert any(x.get("addon") == "service.skin.arctic.fuse.3.dev.trailers" and x.get("version") == "0.4.8" and x.get("optional") is None for x in manifest.findall("./requires/import"))
          # Compile-check the service without importing Kodi runtime modules.
          source_service = "kodi-dev-addons/service.skin.arctic.fuse.3.dev.trailers"
          service_xml = subprocess.check_output(["git", "show", f"{SOURCE_REF}:{source_service}/addon.xml"])
          service_py = subprocess.check_output(["git", "show", f"{SOURCE_REF}:{source_service}/service.py"])
          compile(service_py, "service.py", "exec")
          # Emby-only regression suite. Kodi's service must NEVER invoke
          # plugin.video.youtube, even when Emby stores YouTube remote trailers.
          import sys, types, tempfile, sqlite3, os, json
          xbmc_mock = types.ModuleType("xbmc")
          xbmc_mock.LOGINFO, xbmc_mock.LOGWARNING, xbmc_mock.LOGERROR = 1, 2, 3
          xbmc_mock.log = lambda *args, **kw: None
          state = {
              "active_window": 10000, "focus_widget": False, "num_items": "3",
              "position": "1", "title": "Emby Film", "dbid": "123", "dbtype": "movie",
              "list_trailer": "http://127.0.0.1:57342/dynamic/trailer/film.mp4",
              "movie_trailer": "http://127.0.0.1:57342/dynamic/trailer/film.mp4",
              "autoscroll": "30s", "dialog_busy": False, "property_temporarily_blank": False
          }
          def condition(expr):
              if expr.startswith("Skin.HasSetting(Spotlight.AutoTrailer)"):
                  return True
              if expr.startswith("Window.IsActive(Home)"):
                  return state["active_window"] == 10000
              for hub_id in (1101,1102,1103,1104):
                  if expr.startswith("Window.IsActive(" + str(hub_id) + ")"):
                      return state["active_window"] == hub_id
              if expr.startswith("ControlGroup(500).HasFocus()"):
                  return state["focus_widget"]
              return False
          xbmc_mock.getCondVisibility = condition
          def get_label(expr):
              if expr == "Window.Property(TMDbHelper.WidgetContainer)":
                  # Emby loading dialogs can hide foreground Window.Property.
                  if state["dialog_busy"] or state["property_temporarily_blank"]:
                      return ""
                  win = windows.get(state["active_window"])
                  return win.getProperty("TMDbHelper.WidgetContainer") if win else ""
              if expr in ("Window(Home).Property(TMDbHelper.WidgetContainer)",
                          "Window(11101).Property(TMDbHelper.WidgetContainer)",
                          "Window(11102).Property(TMDbHelper.WidgetContainer)",
                          "Window(11103).Property(TMDbHelper.WidgetContainer)",
                          "Window(11104).Property(TMDbHelper.WidgetContainer)"):
                  if state["property_temporarily_blank"]:
                      return ""
                  windowid = (10000 if "Home" in expr else
                              int(expr.split("(")[1].split(")")[0]) - 10000)
                  return windows[windowid].getProperty("TMDbHelper.WidgetContainer")
              return {
                  "Container(301).NumItems": state["num_items"],
                  "Container(301).ListItem.Title": state["title"],
                  "Container(301).ListItem.DBID": state["dbid"],
                  "Container(301).ListItem.DBType": state["dbtype"],
                  "Container(301).ListItem.Trailer": state["list_trailer"],
                  "Container(301).CurrentItem": state["position"],
                  "Container(301).ListItem.FileNameAndPath": "videodb://library/item",
                  "Skin.String(AutoScrollTime)": state["autoscroll"],
              }.get(expr, "")
          xbmc_mock.getInfoLabel = get_label
          xbmc_mock.executeJSONRPC = lambda req: json.dumps({
              "result": {"moviedetails": {"trailer": state["movie_trailer"]}}})
          class Player:
              def __init__(self):
                  self.playing = False
                  self.file = ""
                  self.stops = 0
                  self.plays = []
              def isPlaying(self): return self.playing
              def isPlayingVideo(self): return self.playing
              def getPlayingFile(self): return self.file
              def play(self, uri, windowed=False):
                  assert windowed and "youtube" not in uri.lower(), uri
                  self.file = uri
                  self.plays.append(uri)
                  self.playing = True
              def stop(self):
                  self.stops += 1
                  self.playing = False
                  self.file = ""
          class Win:
              def __init__(self): self.props = {"TMDbHelper.WidgetContainer": "301"}
              def getProperty(self, name): return self.props.get(name,"")
              def setProperty(self, name, value): self.props[name]=value
          player = Player()
          action_log = []
          def builtin(action, wait=False):
              assert wait is False
              action_log.append(action)
              if action == "PlayerControl(Stop)": player.stop()
              else: assert action == "Control.Move(301,1)",action
          xbmc_mock.executebuiltin = builtin
          xbmc_mock.Player = lambda: player
          xbmc_mock.Monitor = lambda: None
          gui_mock = types.ModuleType("xbmcgui")
          windows = {w:Win() for w in (10000,1101,1102,1103,1104)}
          def fake_python_window(number):
              # Reproduce user's Kodi 22: xbmcgui.Window(1102) raises
              # "Window id does not exist" even while Custom_1102_Hub.xml
              # is active as Kodi GUI window 11102.
              if number != 10000:
                  raise RuntimeError("Window id does not exist")
              return windows[number]
          gui_mock.Window = fake_python_window
          fs_mock = types.ModuleType("xbmcvfs")
          old_modules = {k:sys.modules.get(k) for k in ("xbmc","xbmcgui","xbmcvfs")}
          sys.modules.update({"xbmc":xbmc_mock,"xbmcgui":gui_mock,"xbmcvfs":fs_mock})
          try:
              with tempfile.TemporaryDirectory(prefix="kodi-emby-tv-") as dbdir:
                  fs_mock.translatePath = lambda uri: (
                      os.path.join(dbdir, os.path.basename(uri))
                      if uri.endswith(".json") else dbdir)
                  downloaded_themes = set()
                  fs_mock.exists = lambda uri: uri in downloaded_themes
                  for version, trailer in (
                      (135, "http://127.0.0.1:57342/dynamic/trailer/old.mp4"),
                      (136, "http://127.0.0.1:57342/dynamic/trailer/series.mp4")):
                      conn = sqlite3.connect(os.path.join(dbdir, "MyVideos%d.db" % version))
                      conn.execute("CREATE TABLE tvshow (idShow INTEGER PRIMARY KEY,c00 TEXT,c16 TEXT)")
                      conn.execute("INSERT INTO tvshow VALUES (123,'Emby Serie',?)",(trailer,))
                      conn.commit()
                      conn.close()
                  # Exact Emby Next Gen 12.4.23 schema and ThemeVideo lookup.
                  # Both Emby DB and server-settings JSON are fixtures only.
                  server_id = "demotestserver"
                  theme_id = 190023
                  theme_metadata = json.dumps({
                      "Id": theme_id, "Container": "mp4",
                      "MediaSources": [{"Id":"mediasource_190023"}]})
                  embydb = os.path.join(dbdir, "emby_" + server_id + ".db")
                  conn = sqlite3.connect(embydb)
                  conn.execute("CREATE TABLE Video "
                               "(EmbyId INTEGER PRIMARY KEY, EmbyExtraType TEXT, "
                               "EmbyParentType TEXT, KodiParentId INTEGER, "
                               "EmbyMetaData TEXT)")
                  conn.execute("INSERT INTO Video VALUES (?,?,?,?,?)",
                               (theme_id, "ThemeVideo", "Series", 123, theme_metadata))
                  conn.commit()
                  conn.close()
                  settingspath = os.path.join(dbdir, "servers_" + server_id + ".json")
                  with open(settingspath, "w", encoding="utf-8") as fp:
                      json.dump({"ServerId":server_id, "ServerUrl":"https://emby-fixture.invalid",
                                 "AccessToken":"fixture-secret-not-for-logs",
                                 "DeviceId":"fixture-test-device"}, fp)
                  namespace = {"__name__":"kodi_mock"}
                  exec(compile(service_py,"service.py","exec"),namespace)
                  norm = namespace["_normalize_trailer"]
                  assert norm("plugin://plugin.video.youtube/play/?video_id=ABCDEFGHIJK") == ""
                  assert norm("https://www.youtube.com/watch?v=ABCDEFGHIJK") == ""
                  assert norm("https://youtu.be/ABCDEFGHIJK") == ""
                  assert norm("plugin://plugin.video.themoviedb.helper/?q=trailer") == ""
                  assert norm("http://127.0.0.1:57342/dynamic/trailer/series.mp4")
                  assert namespace["_tvshow_db_trailer"]("123","tvshow") .endswith("/series.mp4")
                  assert namespace["_tvshow_db_trailer"]("123","","Wrong Title") == ""
                  assert namespace["_movie_db_trailer"]("123","tvshow") == ""
                  assert "TMDbHelper.ListItem.Trailer" not in service_py.decode("utf-8")
                  theme = namespace["_emby_series_theme_video"]("123", "tvshow")
                  assert "/emby/videos/190023/stream.mp4?" in theme
                  assert "MediaSourceId=mediasource_190023" in theme
                  assert "seekable=0" in theme and "plugin.video.youtube" not in theme
                  assert not namespace["_emby_series_theme_video"]("123","movie")
                  assert not namespace["_emby_series_theme_video"]("999","tvshow")
                  local_theme = ("special://profile/addon_data/plugin.service.emby-next-gen/"
                                 "EMBY-themes/demotestserver_190023.mp4")
                  downloaded_themes.add(local_theme)
                  assert namespace["_emby_series_theme_video"]("123","tvshow") == local_theme
                  downloaded_themes.clear()
                  print("Emby Series ThemeVideo lookup PASSED: remote stream, local theme, ID guards, read-only DB")
                  service = namespace["SpotlightService"]()
                  service._tick()
                  service.changed_at -= 2.0
                  service._tick()
                  assert not player.playing, "Startup grace must suppress early preview"
                  service.started_at -= 15.0
                  service._tick()
                  assert player.playing and player.plays[-1].endswith("/film.mp4")
                  # The actual Kodi log showed DialogBusy temporarily hiding
                  # foreground focus during video startup, causing a
                  # destructive Stop/replay loop in the previous version.
                  state["dialog_busy"] = True
                  play_count = len(player.plays)
                  stop_count = player.stops
                  service._tick()
                  assert service.owned and player.playing
                  assert player.stops == stop_count and len(player.plays) == play_count
                  state["dialog_busy"] = False
                  state["property_temporarily_blank"] = True
                  service._tick()
                  assert player.playing and service.key is not None
                  state["property_temporarily_blank"] = False
                  service._tick()
                  assert service.owned and len(player.plays) == play_count
                  assert player.stops == stop_count
                  print("Emby DialogBusy regression PASSED: no Stop/replay loop")
                  service.changed_at -= 26.2
                  service._tick()
                  assert not player.playing and player.stops == 1
                  service.changed_at -= 2.1
                  service._tick()
                  assert "Control.Move(301,1)" in action_log
                  # TV show preview reads Emby-synced tvshow.c16, not TMDb.
                  service.stop_queued_at -= 2.0
                  state.update({"active_window":1102, "title":"Emby Serie",
                                "position":"2", "dbtype":"tvshow", "list_trailer":""})
                  service._tick()
                  assert service.active_window_id == 1102
                  assert service.home is windows[10000], "Custom hub must not instantiate a Python GUI Window"
                  assert namespace["_spotlight"](service.home)[1] == "spotlight"
                  assert "/emby/videos/190023/stream.mp4?" in service.trailer
                  assert "plugin.video.youtube" not in service.trailer
                  state["dialog_busy"] = True
                  assert namespace["_spotlight"](service.home)[1] == "spotlight"
                  state["dialog_busy"] = False
                  service.changed_at -= 2.0
                  service._tick()
                  assert player.playing and "/emby/videos/190023/stream.mp4?" in player.plays[-1]
                  service._tick()
                  assert service.owned
                  windows[1102].setProperty("TMDbHelper.WidgetContainer","501")
                  service._tick()
                  assert not player.playing, "Must stop on native widget focus"
                  assert namespace["_spotlight"](service.home)[1] == "native_widget"
                  service.stop_queued_at -= 1.0
                  windows[1102].setProperty("TMDbHelper.WidgetContainer","301")
                  # A YouTube-only trailer from Emby must simply be ignored.
                  state.update({"position":"3","title":"Remote-only Film",
                                "dbtype":"movie", "list_trailer":
                                "plugin://plugin.video.youtube/play/?video_id=ABCDEFGHIJK",
                                "movie_trailer":
                                "plugin://plugin.video.youtube/play/?video_id=ABCDEFGHIJK"})
                  service._tick()
                  assert not service.trailer and not player.playing
                  service.changed_at -= 31.0
                  service._tick()
                  assert action_log.count("Control.Move(301,1)") >= 2
                  print("Kodi custom Hub regression PASSED: window 1102 active, xbmcgui.Window(1102) unavailable, focus read via Window.Property")
                  print("Emby-only regression PASSED: TV database, no YouTube, early startup guard, Stop and hub timing")
          finally:
              for name, previous in old_modules.items():
                  if previous is None: sys.modules.pop(name,None)
                  else: sys.modules[name]=previous

          companion = ET.fromstring(service_xml)
          assert companion.get("id") == "service.skin.arctic.fuse.3.dev.trailers"
          service_id = companion.get("id")
          service_version = companion.get("version")
          service_dir = out / service_id
          service_dir.mkdir(parents=True, exist_ok=True)
          (service_dir / "addon.xml").write_bytes(service_xml)
          with ZipFile(service_dir / f"{service_id}-{service_version}.zip", "w", compression=ZIP_DEFLATED) as service_zip:
              service_zip.writestr(f"{service_id}/addon.xml", service_xml)
              service_zip.writestr(f"{service_id}/service.py", service_py)
          with ZipFile(service_dir / f"{service_id}-{service_version}.zip") as service_check:
              assert service_check.testzip() is None
          with ZipFile(package, "w", compression=ZIP_DEFLATED, compresslevel=6, allowZip64=True) as archive:
              for name, payload in sorted(entries.items()):
                  archive.writestr(DEV_ID + "/" + name, payload)
          with ZipFile(package) as archive:
              assert archive.testzip() is None
              assert len(archive.namelist()) >= 3500
              assert archive.read(DEV_ID + "/addon.xml") == entries["addon.xml"]
          # GNU unzip validation catches archive damage that Python ZipFile.testzip may miss.
          subprocess.run(["unzip", "-tq", str(package)], check=True)
          assert package.stat().st_size < 100 * 1024 * 1024, "GitHub single-file limit exceeded"
          # Remove the old invalid archives, which were committed before *.zip was marked binary.
          for obsolete in target.glob("skin.arctic.fuse.3.dev-*.zip"):
              if obsolete != package:
                  obsolete.unlink()
          for art in ("addon.xml", "icon.png", "fanart.jpg"):
              (target / art).write_bytes(entries[art])

          root = ET.Element("addons")
          root.append(ET.parse(out / "repository.ntls2000.kodi.dev" / "addon.xml").getroot())
          root.append(manifest)
          root.append(companion)
          ET.indent(root, space="    ")
          catalog = ET.tostring(root, encoding="utf-8", xml_declaration=True) + b"\n"
          (out / "addons.xml").write_bytes(catalog)
          (out / "addons.xml.md5").write_text(hashlib.md5(catalog).hexdigest() + "\n", encoding="ascii")
          assert len(ET.parse(out / "addons.xml").getroot()) == 3
          print("Published source branch:", SOURCE_REF)
          print("Skin ID:", DEV_ID, "version:", DEV_VER, "files:", len(entries))
          print("Kodi ZIP bytes:", package.stat().st_size)
          print("Catalog MD5:", hashlib.md5(catalog).hexdigest())
          PY
      - name: Commit complete Kodi repository publication
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f kodi-repository/skin.arctic.fuse.3.dev/ kodi-repository/service.skin.arctic.fuse.3.dev.trailers/ kodi-repository/addons.xml kodi-repository/addons.xml.md5
          if ! git diff --cached --quiet; then
            git commit -m "feat(kodi): Hub Spotlight trailers and Standard/Premium buttons 3.4.2.20"
            git push origin HEAD:kodi-repo
          fi
          git cat-file blob HEAD:kodi-repository/skin.arctic.fuse.3.dev/skin.arctic.fuse.3.dev-3.4.2.20.zip > /tmp/git-stored-skin.zip
          unzip -tq /tmp/git-stored-skin.zip
          echo "Published Git blob is a valid ZIP archive"
          git cat-file blob HEAD:kodi-repository/service.skin.arctic.fuse.3.dev.trailers/service.skin.arctic.fuse.3.dev.trailers-0.4.8.zip > /tmp/git-stored-service.zip
          unzip -tq /tmp/git-stored-service.zip
