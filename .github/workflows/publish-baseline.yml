name: Publish Arctic Fuse 3 DEV baseline
on:
  push:
    branches: [kodi-repo]
    paths:
      - '.github/workflows/publish-baseline.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-baseline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout distribution branch and source history
        uses: actions/checkout@v4
        with:
          ref: kodi-repo
          fetch-depth: 0
      - name: Build original-source parallel-install skin and Kodi catalog
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import io
          import subprocess
          import tarfile
          import xml.etree.ElementTree as ET
          from zipfile import ZipFile, ZIP_DEFLATED

          SOURCE_REF = "origin/dev-kodi22"
          SRC_ID = "skin.arctic.fuse.3"
          DEV_ID = "skin.arctic.fuse.3.dev"
          DEV_VER = "3.4.2.45"
          out = Path("kodi-repository")
          target = out / DEV_ID
          target.mkdir(parents=True, exist_ok=True)
          package = target / (DEV_ID + "-" + DEV_VER + ".zip")
          source_tar = subprocess.check_output(["git", "archive", "--format=tar", SOURCE_REF])
          source = tarfile.open(fileobj=io.BytesIO(source_tar), mode="r:")
          entries = {}
          for entry in source:
              if not entry.isfile():
                  continue
              name = entry.name
              if name.startswith((".github/", "kodi-dev-addons/")) or name in (".gitignore", ".gitattributes"):
                  continue
              payload = source.extractfile(entry).read()
              if name.endswith((".xml", ".json", ".xmltemplate", ".xsp", ".py", ".md", ".txt", ".yml", ".yaml")):
                  txt = payload.decode("utf-8")
                  txt = txt.replace(SRC_ID, DEV_ID)
                  if name == "addon.xml":
                      txt = txt.replace('name="Arctic Fuse 3"', 'name="Arctic Fuse 3 DEV (Original)"', 1)
                      txt = txt.replace('version="3.4.2"', 'version="' + DEV_VER + '"', 1)
                      txt = txt.replace('provider-name="jurialmunkey"', 'provider-name="jurialmunkey / ntls2000"', 1)
                      service_import = '<import addon="service.skin.arctic.fuse.3.dev.trailers" version="0.4.8" />'
                      txt = txt.replace('</requires>', '    ' + service_import + '\n    </requires>', 1)
                      txt = txt.replace('addon="resource.images.arctic.splash" version="1.0.6"', 'addon="resource.images.arctic.splash" version="1.0.0"', 1)
                  payload = txt.encode("utf-8")
              entries[name] = payload

          manifest = ET.fromstring(entries["addon.xml"])
          assert manifest.get("id") == DEV_ID
          assert manifest.get("version") == DEV_VER
          assert any(x.get("addon") == "resource.images.arctic.splash" and x.get("version") == "1.0.0" for x in manifest.findall("./requires/import")), "Arctic Splash version check failed"
          assert "LICENSE.txt" in entries
          assert "media/Textures.xbt" in entries
          assert "1080i/Home.xml" in entries
          # This release renames only the visible setting; its Kodi key and
          # previously saved user choice must remain untouched.
          setting_source = entries["1080i/Includes_SkinSettings.xml"].decode("utf-8")
          assert "<label>Activer les trailers dans le Spotlight</label>" in setting_source
          assert "<selected>Skin.HasSetting(Spotlight.AutoTrailer)</selected>" in setting_source
          assert "<onclick>Skin.ToggleSetting(Spotlight.AutoTrailer)</onclick>" in setting_source
          # Opt-in ORIGINAL appearance restored with a permanent SINGLE
          # focusable pair (311/312); no condition on button visibility or IDs.
          # Default remains the user-approved Premium LAB 3.4.2.36 look.
          # The setting reloads Kodi's skin so conditional appearance includes
          # update their sizes, texture, label, arrow and graphical offsets.
          hub_xml = entries["1080i/Includes_Hubs.xml"].decode("utf-8")
          texture_xml = entries["1080i/Includes_Textures.xml"].decode("utf-8")
          home_xml = entries["1080i/Includes_Home.xml"].decode("utf-8")
          for source in (hub_xml, texture_xml, home_xml, setting_source):
              ET.fromstring(source)
          assert 'Hub_Spotlight_Button_Premium' not in hub_xml
          assert hub_xml.count('<include content="Hub_Spotlight_Button_Circle">') == 2
          assert '<include content="Hub_Spotlight_Button_Circle" condition=' not in hub_xml
          assert '<control type="group" id="316">' in hub_xml
          hub_tree = ET.fromstring(hub_xml)
          skin_calls = hub_tree.findall(".//include[@content='Hub_Spotlight_Button_Circle']")
          assert len(skin_calls) == 2
          assert [next(p.text for p in call.findall("param") if p.get("name") == "id")
                  for call in skin_calls] == ["311", "312"]
          spotlight_root = hub_tree.find("./include[@name='Hub_Spotlight_Button_Circle']")
          assert spotlight_root is not None
          template = spotlight_root.find("definition")
          native_buttons = template.findall("./control[@type='button']")
          original_groups = template.findall("./control[@type='group']")
          assert len(native_buttons) == 1 and native_buttons[0].get("id") == "$PARAM[id]"
          assert len(original_groups) == 1 and original_groups[0].get("id") == "$PARAM[groupid]"
          assert native_buttons[0].find("nested") is not None
          graphic_groups = original_groups[0].findall("./control[@type='group']")
          assert len(graphic_groups) == 4, "Exactly 2 decorative states in each of the 2 styles"
          conditions = [child.findtext("visible") for child in graphic_groups]
          assert conditions == [
              "Skin.HasSetting(Spotlight.NormalButtons) + !Control.HasFocus($PARAM[id])",
              "Skin.HasSetting(Spotlight.NormalButtons) + Control.HasFocus($PARAM[id])",
              "!Skin.HasSetting(Spotlight.NormalButtons) + !Control.HasFocus($PARAM[id])",
              "!Skin.HasSetting(Spotlight.NormalButtons) + Control.HasFocus($PARAM[id])",
          ]
          assert all(child.get("type") == "group" for child in graphic_groups)
          # Compare original circular graphics and Premium rounded graphics
          # against separate frozen, tested source versions (tag edits aside).
          old_xml = subprocess.check_output(["git", "show",
              "2635b1ff0b5c6524aae89ee4f65398bc31475598:1080i/Includes_Hubs.xml"])
          old_lab_xml = subprocess.check_output(["git", "show",
              "513f00e028cd3ef2c8c71537512d6c18178d7d79:1080i/Includes_Hubs.xml"])
          def decorative_groups(data):
              root = ET.fromstring(data)
              include = root.find("./include[@name='Hub_Spotlight_Button_Circle']")
              assert include is not None
              return include.find("definition").find("./control[@type='group']").findall("./control[@type='group']")
          def canon(el):
              return (el.tag, tuple(sorted(el.attrib.items())), (el.text or "").strip(),
                      tuple(canon(c) for c in el))
          for cur, expected in zip(graphic_groups[:2], decorative_groups(old_xml)):
              # Visibility is extended only with a skin setting, not a new control.
              cur.find("visible").text = cur.find("visible").text.replace(
                  "Skin.HasSetting(Spotlight.NormalButtons) + ", "", 1)
              assert canon(cur) == canon(expected), "Original Arctic Fuse circular artwork changed"
          for cur, expected in zip(graphic_groups[2:], decorative_groups(old_lab_xml)):
              cur.find("visible").text = cur.find("visible").text.replace(
                  "!Skin.HasSetting(Spotlight.NormalButtons) + ", "", 1)
              assert canon(cur) == canon(expected), "User-approved LAB rounded artwork changed"
          assert hub_xml.count('<param name="card_width">360</param>') == 2
          assert hub_xml.count('<param name="card_width">320</param>') == 1
          assert '<width>240</width>' in hub_xml and '<width>385</width>' in hub_xml
          assert '<left>20</left>' in hub_xml and '<left>65</left>' in hub_xml
          # Regression: each graphic group MUST expand to a single left
          # coordinate per mode. In DEV 3.4.2.38 the unconditional Info
          # left=80 survived alongside Premium left=0, creating a gap.
          graphic_position = original_groups[0]
          assert graphic_position.find("left") is None, "Conflicting unconditional group left"
          left_children = graphic_position.findall("include")
          assert len(left_children) == 2, "Exactly one selected left per style"
          assert left_children[0].get("content") == "AF3DEV_Spotlight_StandardGraphicOffset"
          assert left_children[0].get("condition") == "Skin.HasSetting(Spotlight.NormalButtons)"
          assert left_children[0].findtext("./param[@name='left']") == "$PARAM[left]"
          assert left_children[1].get("condition") == "!Skin.HasSetting(Spotlight.NormalButtons)"
          assert left_children[1].text == "AF3DEV_Spotlight_PremiumGraphicOffset"
          standard_offset = hub_tree.find("./include[@name='AF3DEV_Spotlight_StandardGraphicOffset']")
          premium_offset = hub_tree.find("./include[@name='AF3DEV_Spotlight_PremiumGraphicOffset']")
          assert standard_offset is not None and standard_offset.findtext("./definition/left") == "$PARAM[left]"
          assert premium_offset is not None and premium_offset.findtext("left") == "0"
          assert skin_calls[0].findtext("./param[@name='left']") is None, "Play must retain default left=0"
          assert skin_calls[1].findtext("./param[@name='left']") == "80", "Original info has left=80"
          assert '<include condition="Skin.HasSetting(Spotlight.NormalButtons)">AF3DEV_Spotlight_StandardPlayGroupWidth</include>' in hub_xml
          assert '<include condition="!Skin.HasSetting(Spotlight.NormalButtons)">AF3DEV_Spotlight_PremiumPlayGroupWidth</include>' in hub_xml
          assert '<include condition="Skin.HasSetting(Spotlight.NormalButtons)">AF3DEV_Spotlight_StandardRightArrowOffset</include>' in hub_xml
          assert '<include condition="!Skin.HasSetting(Spotlight.NormalButtons)">AF3DEV_Spotlight_PremiumRightArrowOffset</include>' in hub_xml
          style_normal = hub_tree.find("./include[@name='AF3DEV_Spotlight_ButtonAppearance_Standard']")
          style_premium = hub_tree.find("./include[@name='AF3DEV_Spotlight_ButtonAppearance_Premium']")
          assert style_normal is not None and style_premium is not None
          assert style_normal.findtext("./definition/height") == "80"
          assert style_premium.findtext("./definition/height") == "84"
          assert style_normal.find("./definition/include").text == "Texture_Highlight_Underline_H"
          assert style_premium.findtext("./definition/focusedcolor") == "FF181818"
          include_attrs = [c.get("condition") for c in native_buttons[0].findall("include")]
          assert include_attrs == [
              "Skin.HasSetting(Spotlight.NormalButtons)",
              "!Skin.HasSetting(Spotlight.NormalButtons)",
          ]
          assert '<param name="label">$VAR[AF3DEV_SpotlightPlayButtonLabel]</param>' in hub_xml
          assert '<param name="label">$VAR[AF3DEV_SpotlightInfoButtonLabel]</param>' in hub_xml
          assert '<value>Lecture</value>' in home_xml
          assert '<value>Informations</value>' in home_xml
          assert '$VAR[Label_FullscreenWidget_PlayButton]' in home_xml
          assert '$VAR[Label_FullscreenWidget_InfoButton]' in home_xml
          assert 'Normal (boutons d\'origine)' in home_xml
          assert '<value>Premium (boutons arrondis)</value>' in home_xml
          assert '<onright>312</onright>' in hub_xml
          assert '<ondown>$VAR[Hub_Action_Widgets]</ondown>' in hub_xml
          assert '<onclick>SetFocus(311)</onclick>' in hub_xml
          assert '<onclick>SetFocus(312)</onclick>' in hub_xml
          assert 'Skin.HasSetting(Spotlight.PremiumButtons)' not in hub_xml
          assert 'Skin.HasSetting(Spotlight.PremiumButtons)' not in home_xml
          assert '<label>Style des boutons du Spotlight</label>' in setting_source
          assert '<label2>$VAR[AF3DEV_SpotlightButtonStyle]</label2>' in setting_source
          assert '<onclick>Skin.ToggleSetting(Spotlight.NormalButtons)</onclick>' in setting_source
          assert '<onclick>ReloadSkin()</onclick>' in setting_source
          assert 'Skin.ToggleSetting(Spotlight.PremiumButtons)' not in setting_source
          assert '<label>Activer les trailers dans le Spotlight</label>' in setting_source
          assert '<onclick>Skin.ToggleSetting(Spotlight.AutoTrailer)</onclick>' in setting_source
          # Exact certified LAB PNGs (no visual modification), even in Normal.
          import struct
          digests = {
              "media/common/spotlight-outline.png": "cc16465f70a043b9326fdd26a5740965399ca80833537574820913d9c3c3f134",
              "media/common/spotlight-fill.png": "7e521cd8bd9c0dcd9a3f2a7481cb858f8d1f29ff55d00f693e8c6250a0d1da7d",
          }
          for src_name, digest in digests.items():
              source_bytes = subprocess.check_output(["git", "show",
                  "513f00e028cd3ef2c8c71537512d6c18178d7d79:" + src_name])
              assert entries[src_name] == source_bytes, "Premium art changed: " + src_name
              assert source_bytes.startswith(bytes.fromhex("89504e470d0a1a0a"))
              assert struct.unpack(">II", source_bytes[16:24]) == (96, 84)
              assert hashlib.sha256(source_bytes).hexdigest() == digest
          # 3.4.2.45 polishes only CineVitrine and CinePanorama artwork.
          # All menu style options, Spotlight and Emby 0.4.8 are frozen.
          prior_commit = "0f3e8b913375121a196d35f4b4f340d069f06bb7"
          source_changes = subprocess.check_output([
              "git", "diff", "--name-only", prior_commit, SOURCE_REF
          ], text=True).splitlines()
          expected_genres = [
              "extras/hub/streaming/01-Films-Action.xsp",
              "extras/hub/streaming/02-Films-Romance.xsp",
              "extras/hub/streaming/03-Films-Comedies.xsp",
              "extras/hub/streaming/04-Films-Thrillers.xsp",
              "extras/hub/streaming/05-Films-ScienceFiction.xsp",
              "extras/hub/streaming/06-Films-Horreur.xsp",
              "extras/hub/streaming/07-Films-Animation.xsp",
              "extras/hub/streaming/08-Films-Documentaires.xsp",
              "extras/hub/streaming/09-Series-Action.xsp",
              "extras/hub/streaming/10-Series-Dramatiques.xsp",
              "extras/hub/streaming/11-Series-Comedies.xsp",
              "extras/hub/streaming/12-Series-Policieres.xsp",
              "extras/hub/streaming/13-Series-ScienceFiction.xsp",
              "extras/hub/streaming/14-Series-Romance.xsp",
          ]
          assert source_changes == [
              "1080i/Includes_Layouts.xml", "1080i/Includes_Objects.xml"
          ], ("3.4.2.45 may refine only the two vignette layout files", source_changes)
          for unchanged in (
              "1080i/Includes_Hubs.xml", "1080i/Includes_Home.xml",
              "1080i/Includes_SkinSettings.xml", "extras/scripts/hub_transfer.py",
              "1080i/Includes_Constants.xml", "1080i/Includes_Labels.xml",
              "1080i/Includes_Actions.xml", "1080i/Includes_Lists.xml",
              "1080i/Includes_Widgets.xml",
              "shortcuts/generator/data/setup/widgets_include_row.xml",
          ):
              baseline = subprocess.check_output(["git", "show", prior_commit + ":" + unchanged])
              assert entries[unchanged] == baseline.replace(SRC_ID.encode(), DEV_ID.encode()), (
                  "Validated DEV source modified", unchanged)
          movie_count = show_count = 0
          for xsp in expected_genres:
              playlist = ET.fromstring(entries[xsp])
              assert playlist.tag == "smartplaylist"
              if xsp.split("/")[-1].startswith(("01-","02-","03-","04-","05-","06-","07-","08-")):
                  assert playlist.get("type") == "movies"
                  movie_count += 1
              else:
                  assert playlist.get("type") == "tvshows"
                  show_count += 1
              rule = playlist.find("rule")
              assert rule is not None and rule.get("field") == "genre"
              assert rule.get("operator") == "contains"
              assert len(rule.findall("value")) >= 1
              assert playlist.findtext("limit") == "60"
              assert playlist.findtext("./order") == "dateadded"
          assert (movie_count, show_count) == (8, 6)
          # CineVitrine must be genuinely selectable and renderable in both
          # Home and Hub widget rows, not merely a static visual mock-up.
          constants = ET.fromstring(entries["1080i/Includes_Constants.xml"])
          sizes = {c.get("name"): c.text for c in constants.findall("constant")}
          assert (sizes["view_cinevitrine_item_w"], sizes["view_cinevitrine_item_h"]) == ("400", "300"), "4:3 tiles changed"
          assert sizes["view_cinevitrine_itemlayout_w"] == "440"
          assert sizes["view_cinevitrine_movement"] == "4"
          layouts = ET.fromstring(entries["1080i/Includes_Layouts.xml"])
          lists = ET.fromstring(entries["1080i/Includes_Lists.xml"])
          widgets = ET.fromstring(entries["1080i/Includes_Widgets.xml"])
          actions = ET.fromstring(entries["1080i/Includes_Actions.xml"])
          labels = ET.fromstring(entries["1080i/Includes_Labels.xml"])
          generator = ET.fromstring(entries["shortcuts/generator/data/setup/widgets_include_row.xml"])
          lv = layouts.find("./include[@name='Layout_CineVitrine']")
          li = lists.find("./include[@name='List_CineVitrine_Row']")
          assert lv is not None and li is not None
          assert len(layouts.findall("./include[@name='Layout_CineVitrine']")) == 1
          assert len(lists.findall("./include[@name='List_CineVitrine_Row']")) == 1
          assert li.findtext("./definition/include/param[@name='itemlayout_include']") == "Layout_CineVitrine"
          assert li.findtext("./definition/include/param[@name='id']") == "$PARAM[id]"
          assert li.findtext("./definition/include/param[@name='control']") == "$PARAM[control]"
          assert li.find("./definition/include/nested") is not None, "Lost focus-navigation slots"
          assert lv.findtext(".//include[@content='Object_Layout_Image_Rectangle']/param[@name='icon']") == "$VAR[Image_Card_Fanart]"
          assert lv.find(".//include[@content='Object_ClearLogo_WithShadow']") is None, "CineVitrine duplicates baked-in artwork logo"
          assert lv.find(".//include[@content='Object_SelectBox']") is not None
          assert lv.find(".//control[@type='label']") is None, "CineVitrine must be image only"
          assert lv.find(".//control[@type='image']/texture[@colordiffuse='DFFFFFFF']") is None
          assert widgets.find("./include[@name='Widget_Busy_BlankItems__List_CineVitrine_Row']") is not None
          assert widgets.find("./include[@name='Widget_Busy_Spinner_Height__List_CineVitrine_Row']") is not None
          choose = actions.find("./variable[@name='Action_Shortcut_SetWidgetStyle']")
          chosen_label = labels.find("./variable[@name='Label_Shortcut_Widget_Style']")
          assert choose is not None and 'CinéVitrine=CineVitrine' in "".join(choose.itertext())
          assert chosen_label is not None and any(v.text == 'CinéVitrine' for v in chosen_label.findall("value"))
          # This catches the actual regression behind the blocked style menu:
          # a duplicate "CinéVitrine=...&&$LOCALIZE[736]" appended to the
          # dialog title created a corrupt RunPlugin options command in .43.
          style_actions = [
              v.text for v in choose.findall("value")
              if v.text and v.text.startswith("RunPlugin(")
          ]
          assert len(style_actions) == 1
          action = style_actions[0]
          assert action.endswith(")")
          action_parts = action[len("RunPlugin("):-1].split("&&")
          assert len(action_parts) == 5, (
              "Style selection RunPlugin must have URL, key, options, heading, confirm",
              action_parts)
          url, key, choices, heading, require_confirm = action_parts
          assert url.endswith("&func=do_edit")
          assert key == "widget_style"
          expected_options = (
              ("$LOCALIZE[20021]", "Poster"),
              ("$LOCALIZE[31045]", "Landscape"),
              ("$LOCALIZE[31320]", "Square"),
              ("$LOCALIZE[31424]", "Board"),
              ("$LOCALIZE[31161]", "Flyer"),
              ("$LOCALIZE[31431]", "Circle"),
              ("$LOCALIZE[31423]", "Card"),
              ("$LOCALIZE[31172]", "Placard"),
              ("CinéVitrine", "CineVitrine"),
              ("CinéPanorama", "CinePanorama"),
          )
          assert choices.split("&") == [label + "=" + value for label, value in expected_options], (
              "Corrupted or duplicated style choices", choices)
          assert heading == "$LOCALIZE[736]" and require_confirm == "True", (
              "Broken style selector title/tail", heading, require_confirm)
          assert action.count("CinéVitrine=CineVitrine") == 1
          assert action.count("CinéPanorama=CinePanorama") == 1
          print("WIDGET STYLE ACTION PASSED: 10 unique options, exact 5 segments, normal dialog title; fixes blocked Style menu")
          rule = generator.find("./rules[@name='widget_include']")
          assert rule is not None and any(
              x.findtext("condition") == "{item_widget_style}==CineVitrine"
              and x.findtext("value") == "List_CineVitrine_Row"
              for x in rule.findall("rule")), "Generator did not map CineVitrine style"
          for xsp in expected_genres:
              original = subprocess.check_output(["git", "show", prior_commit + ":" + xsp])
              assert entries[xsp] == original.replace(SRC_ID.encode(), DEV_ID.encode()), (
                  "Existing user genre path changed", xsp)
          print("CINEVITRINE PASSED: image-only 4:3, no duplicate text, logo or dark footer; Kodi focus, spinner and Emby source unchanged")
          # New opt-in CinePanorama must share the same native fixedlist
          # infrastructure and never add focusable controls.
          p = layouts.find("./include[@name='Layout_CinePanorama']")
          row = lists.find("./include[@name='List_CinePanorama_Row']")
          assert p is not None and row is not None
          assert len(layouts.findall("./include[@name='Layout_CinePanorama']")) == 1
          assert len(lists.findall("./include[@name='List_CinePanorama_Row']")) == 1
          assert (sizes["view_cinepanorama_item_w"], sizes["view_cinepanorama_item_h"]) == ("690", "240")
          assert sizes["view_cinepanorama_itemlayout_w"] == "730"
          assert row.findtext("./definition/include/param[@name='itemlayout_include']") == "Layout_CinePanorama"
          assert row.findtext("./definition/include/param[@name='control']") == "$PARAM[control]"
          assert row.findtext("./definition/include/param[@name='id']") == "$PARAM[id]"
          assert row.find("./definition/include/nested") is not None
          assert p.findtext(".//include[@content='Object_Layout_Image_Rectangle']/param[@name='icon']") == "$VAR[Image_Card_Fanart]"
          assert p.find(".//include[@content='Object_SelectBox']") is not None
          assert p.find(".//control[@type='label']") is not None
          assert p.find(".//control[@type='image']/texture[@colordiffuse='B8000000']") is None, "Old heavy dark band remains"
          assert p.find(".//control[@type='image']/texture[@colordiffuse='BFFFFFFF']").text == "common/poster_fade.png"
          gradient = p.find(".//control[@type='image']/texture[@colordiffuse='BFFFFFFF']")
          assert gradient is not None
          gradient_container = next((c for c in p.findall(".//control[@type='image']")
                                     if c.find("texture") is gradient), None)
          assert gradient_container is not None and gradient_container.findtext("height") == "110"
          badge_regular = p.find("./definition/control/control[2]/include[@content='Object_Indicator']")
          badge_focused = p.find("./definition/control/control[2]/include[@content='Object_SelectBox']")
          assert badge_regular is not None and badge_focused is not None
          assert badge_regular.findtext("./param[@name='centerbottom']") == "36"
          assert badge_focused.findtext("./param[@name='indicator_centerbottom']") == "36"
          assert badge_focused.findtext("./param[@name='focus_pad']") == "-1"
          assert badge_focused.findtext("./param[@name='focus_alpha']") == "E0FFFFFF"
          objects = ET.fromstring(entries["1080i/Includes_Objects.xml"])
          original_objects = ET.fromstring(subprocess.check_output(
              ["git", "show", prior_commit + ":1080i/Includes_Objects.xml"]))
          current_indicator = objects.find("./include[@name='Object_Indicator']")
          current_selectbox = objects.find("./include[@name='Object_SelectBox']")
          original_indicator = original_objects.find("./include[@name='Object_Indicator']")
          original_selectbox = original_objects.find("./include[@name='Object_SelectBox']")
          assert all(el is not None for el in (
              current_indicator, current_selectbox, original_indicator, original_selectbox))
          assert current_indicator.findtext("./param[@name='centerbottom']") == "0"
          assert current_indicator.findtext("./definition/control/centerbottom") == "$PARAM[centerbottom]"
          assert original_indicator.findtext("./definition/control/centerbottom") == "0"
          assert current_selectbox.findtext("./param[@name='focus_pad']") == "-3"
          assert current_selectbox.findtext("./param[@name='focus_alpha']") == "FFFFFFFF"
          assert current_selectbox.findtext("./param[@name='indicator_centerbottom']") == "0"
          focus_inner = current_selectbox.find(".//include[@content='Dimension_Padding']/param[@name='pad']")
          assert focus_inner is not None and focus_inner.text == "$PARAM[focus_pad]"
          assert current_selectbox.find(".//control[@type='image']/colordiffuse").text == "$PARAM[focus_alpha]"
          assert current_selectbox.find(".//include[@content='Object_Indicator']/param[@name='centerbottom']").text == "$PARAM[indicator_centerbottom]"
          # Backward-compatible defaults: all other widget styles use original
          # 0px badge, -3px focus extension and full white highlight.
